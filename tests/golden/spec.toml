# Golden regression cases for real-world CMake formatting.
#
# Paths are relative to the repository root. Rebuild committed outputs with:
#
#   UPDATE_GOLDENS=1 cargo test golden_regressions

[scan_sets.halide-definitions]
files = [
    "tests/data/halide/CMakeLists.txt",
    "tests/data/halide/apps/CMakeLists.txt",
    "tests/data/halide/apps/hannk/halide/CMakeLists.txt",
    "tests/data/halide/apps/linear_algebra/src/CMakeLists.txt",
    "tests/data/halide/cmake/CheckFilesExist.cmake",
    "tests/data/halide/cmake/FindHalide_LLVM.cmake",
    "tests/data/halide/cmake/HalideFeatures.cmake",
    "tests/data/halide/cmake/HalideGeneratorHelpers.cmake",
    "tests/data/halide/cmake/HalidePackageConfigHelpers.cmake",
    "tests/data/halide/cmake/HalideTargetHelpers.cmake",
    "tests/data/halide/cmake/HalideTestHelpers.cmake",
    "tests/data/halide/cmake/TargetExportScript.cmake",
    "tests/data/halide/cmake/WipeStandardFlags.cmake",
    "tests/data/halide/dependencies/spirv/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake",
    "tests/data/halide/packaging/CMakeLists.txt",
    "tests/data/halide/packaging/common/HalideConfig.cmake",
    "tests/data/halide/packaging/pip/CMakeLists.txt",
    "tests/data/halide/python_bindings/cmake/AddPythonTest.cmake",
    "tests/data/halide/python_bindings/test/generators/CMakeLists.txt",
    "tests/data/halide/src/autoschedulers/CMakeLists.txt",
    "tests/data/halide/test/autoschedulers/anderson2021/CMakeLists.txt",
    "tests/data/halide/test/generator/CMakeLists.txt",
    "tests/data/halide/test/runtime/CMakeLists.txt",
    "tests/data/halide/tutorial/CMakeLists.txt",
]

[[cases]]
name = "cmake-top-level-defaults"
inputs = ["tests/data/cmake/CMakeLists.txt"]
golden = "tests/golden/outputs/cmake-top-level-defaults.cmake"

[cases.config]
indent_width = 2

[[cases]]
name = "halide-hannk-80-columns"
inputs = ["tests/data/halide/apps/hannk/CMakeLists.txt"]
golden = "tests/golden/outputs/halide-hannk-80-columns.cmake"
scan_sets = ["halide-definitions"]

[cases.config]
line_width = 80

[[cases]]
name = "halide-top-level-scan-schema"
inputs = ["tests/data/halide/CMakeLists.txt"]
golden = "tests/golden/outputs/halide-top-level-scan-schema.cmake"
scan_sets = ["halide-definitions"]

[cases.config]
line_width = 88

[cases.config.function_schemas.halide_feature]
options = ["ADVANCED"]
one_value_keywords = ["TYPE"]
multi_value_keywords = ["DEPENDS"]

